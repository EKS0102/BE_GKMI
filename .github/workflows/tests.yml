name: Backend Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: presensi_jemaat_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d presensi_jemaat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10


    steps:

      # ===================================================
      # CHECKOUT
      # ===================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ===================================================
      # PYTHON
      # ===================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"


      # ===================================================
      # INSTALL DEPENDENCIES
      # ===================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ===================================================
      # ALEMBIC MIGRATION
      # ===================================================

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/presensi_jemaat_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/presensi_jemaat_test

          SECRET_KEY: github-actions-test-secret-key-that-is-long-enough-1234567890

          ALGORITHM: HS256

          ACCESS_TOKEN_EXPIRE_MINUTES: 60

        run: |
          alembic upgrade head


      # ===================================================
      # RUN TEST
      # ===================================================

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/presensi_jemaat_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/presensi_jemaat_test

          SECRET_KEY: github-actions-test-secret-key-that-is-long-enough-1234567890

          ALGORITHM: HS256

          ACCESS_TOKEN_EXPIRE_MINUTES: 60

        run: |
          pytest -v


      # ===================================================
      # COVERAGE
      # ===================================================

      - name: Run coverage
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/presensi_jemaat_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/presensi_jemaat_test

          SECRET_KEY: github-actions-test-secret-key-that-is-long-enough-1234567890

          ALGORITHM: HS256

          ACCESS_TOKEN_EXPIRE_MINUTES: 60

        run: |
          pytest --cov=. --cov-report=term-missing