services:

  # =======================================================
  # POSTGRESQL
  # =======================================================

  postgres:
    image: postgres:15

    container_name: be_gkmi_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: presensi_jemaat

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d presensi_jemaat"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # =======================================================
  # FASTAPI
  # =======================================================

  api:
    build:
      context: .

    container_name: be_gkmi_api

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/presensi_jemaat

      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/presensi_jemaat_test

      SECRET_KEY: docker-development-secret-key-change-this-later-123456789

      ALGORITHM: HS256

      ACCESS_TOKEN_EXPIRE_MINUTES: 60

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
      ]


# =========================================================
# VOLUMES
# =========================================================

volumes:
  postgres_data: