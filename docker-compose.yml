services:

  # =======================================================
  # POSTGRESQL
  # =======================================================

  postgres:
    image: postgres:15

    container_name: be_gkmi_postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-presensi_jemaat}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-presensi_jemaat}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # =======================================================
  # FASTAPI
  # =======================================================

  api:
    build:
      context: .

    container_name: be_gkmi_api

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-presensi_jemaat}

      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${TEST_DATABASE_NAME:-presensi_jemaat_test}

      SECRET_KEY: ${SECRET_KEY}

      ALGORITHM: ${ALGORITHM:-HS256}

      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}

      ENVIRONMENT: ${ENVIRONMENT:-development}

      CORS_ORIGINS: ${CORS_ORIGINS}

      LOG_DIR: ${LOG_DIR:-logs}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
      ]


# =======================================================
# VOLUMES
# =======================================================

volumes:
  postgres_data: